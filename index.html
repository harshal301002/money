<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Harshal's Money</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
/* Layout: one-column phone app, sticky title bar, fixed bottom tab bar with a raised "add" key. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E7EDEA; --ink:#13201B; --ink-2:#4A5B54; --muted:#76867F;
  --line:#D5DED9; --accent:#1D6A56; --accent-ink:#FFFFFF; --accent-soft:#D5E9E1;
  --needs:#0B7F60; --other:#5B6FE0; --good:#17834A; --good-soft:#D3EEDC; --warn:#9A5B00; --warn-soft:#F6E5C6; --bad:#B0261E; --bad-soft:#F5D8D4;
  --shadow:0 1px 2px rgba(19,32,27,.06),0 6px 20px rgba(19,32,27,.06);
  --display:"Bricolage Grotesque",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1D2925; --ink:#E5EEEA; --ink-2:#A7B7B0; --muted:#7A8B84;
  --line:#283631; --accent:#5BC19F; --accent-ink:#05221A; --accent-soft:#17382E;
  --needs:#249C76; --other:#6D7BEA; --good:#4CC27A; --good-soft:#163A24; --warn:#EFAF4A; --warn-soft:#3A2B10; --bad:#FF8A80; --bad-soft:#3C1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --surface-2:#1D2925; --ink:#E5EEEA; --ink-2:#A7B7B0; --muted:#7A8B84;
  --line:#283631; --accent:#5BC19F; --accent-ink:#05221A; --accent-soft:#17382E;
  --needs:#249C76; --other:#6D7BEA; --good:#4CC27A; --good-soft:#163A24; --warn:#EFAF4A; --warn-soft:#3A2B10; --bad:#FF8A80; --bad-soft:#3C1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.iconbtn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px -4px}
.section-h h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.link{color:var(--accent);font-weight:600;font-size:14px}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.small{font-size:13px}

/* Hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 18px 18px;position:relative;overflow:hidden}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;letter-spacing:-.03em;margin:8px 0 6px}
.hero .sub{font-size:15px;opacity:.92}
.hero .meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);margin-top:16px;overflow:hidden}
.hero .meter i{display:block;height:100%;border-radius:4px;background:var(--accent-ink)}
.hero .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;opacity:.85}
.hero.over{background:var(--bad);color:#fff}

.goalcard{border-radius:20px;padding:18px;display:flex;gap:16px;align-items:center;background:var(--surface);box-shadow:var(--shadow)}
.goalcard.good{background:var(--good-soft)} .goalcard.warn{background:var(--warn-soft)} .goalcard.bad{background:var(--bad-soft)}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em}
.ring .c small{font-family:var(--body);font-size:11px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.goalcard .txt{min-width:0;flex:1}
.goalcard .big2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:4px 0}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface)}
.status.good{color:var(--good)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)}
.today{display:flex;justify-content:space-between;align-items:center;gap:12px}
.today .amt2{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1}
.today .amt2.good{color:var(--good)} .today .amt2.warn{color:var(--warn)} .today .amt2.bad{color:var(--bad)}
.streak{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;padding:10px 12px;border-radius:16px;background:var(--surface-2)}
.streak.on{background:var(--warn-soft);color:var(--warn)}
.streak svg{width:26px;height:26px}
.streak b{font-family:var(--display);font-size:24px;line-height:1}
.streak span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.dot{width:100%;max-width:40px;aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.s-zero{background:var(--good);color:#fff} .s-ok{background:var(--good-soft);color:var(--good)}
.s-warn{background:var(--warn-soft);color:var(--warn)} .s-bad{background:var(--bad-soft);color:var(--bad)}
.s-future{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.dot.now{outline:2px solid var(--ink);outline-offset:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.cal .cell{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;line-height:1.1;max-width:100%}
.cal .cell small{font-size:9.5px;font-weight:600;opacity:.9}
.keyrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.keyrow span{display:flex;align-items:center;gap:5px}.keyrow i{width:12px;height:12px;border-radius:4px}
.months{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:10px}
.mchip{flex:none;min-width:76px;padding:10px;border-radius:14px;text-align:center;font-size:12px;font-weight:700}
.mchip b{display:block;font-family:var(--display);font-size:15px;margin-top:2px}
.balance{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px 18px}
.balance .label{color:inherit;opacity:.8}
.balance .big{font-family:var(--display);font-weight:700;font-size:48px;line-height:1;letter-spacing:-.03em;margin:8px 0 8px}
.balance .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
.balance button{color:inherit;opacity:.85;font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.chart{position:relative;margin-top:8px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .tip{position:absolute;top:4px;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.5;white-space:nowrap;transform:translateX(-50%)}
.chart .tip b{font-weight:700}
.chart .tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.mile{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;align-items:baseline;font-size:14px}
.mile .h{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mile .v{font-variant-numeric:tabular-nums;text-align:right}
.mile .m{font-family:var(--display);font-weight:700}
.hist-row{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:16px;text-align:right;min-width:0;width:100%}
.split{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:12px 0 10px}
.split i{display:block;height:100%}
.split i:first-child{border-radius:7px 0 0 7px}.split i:last-child{border-radius:0 7px 7px 0}.split i:only-child{border-radius:7px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.legend > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.legend .k{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.legend .k i{width:10px;height:10px;border-radius:3px;flex:none}
.legend b{font-family:var(--display);font-size:22px;letter-spacing:-.01em}
.legend .p{font-size:12px;color:var(--muted)}
.group{margin-top:14px}
.group h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:6px}
.group h3 i{width:8px;height:8px;border-radius:2px}
.line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.line:last-child{border-bottom:0}
.line span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.line .num{font-weight:600}
button.line.active{color:var(--accent)}
.ledger{display:flex;flex-direction:column}
.ledger .line{font-size:15px}
.ledger .line.total{border-bottom:0;padding-top:10px}
.ledger .line.total span:last-child{font-family:var(--display);font-size:24px;font-weight:700}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--display);font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}

.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--surface-2);font-size:14px}
.banner.warn{background:var(--warn-soft)} .banner.warn strong{color:var(--warn)}
.banner.bad{background:var(--bad-soft)} .banner.bad strong{color:var(--bad)}
.banner .grow{flex:1;min-width:0}
.banner button{white-space:nowrap}

/* Lists */
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.row + .row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.in{color:var(--accent)}
.badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2);flex:none}
.badge.in{background:var(--accent-soft);color:var(--accent)}
.daygroup .dt{float:right;font-weight:700;letter-spacing:0}.daygroup .dt.s-ok{color:var(--good);background:none}.daygroup .dt.s-zero{color:var(--good);background:none}.daygroup .dt.s-warn{color:var(--warn);background:none}.daygroup .dt.s-bad{color:var(--bad);background:none}
.daygroup{padding:10px 14px 4px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;background:var(--surface)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Budget bars */
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .3s}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.cat{display:block;padding:12px 14px;width:100%;text-align:left}
.cat + .cat{border-top:1px solid var(--line)}
.cat .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cat .name{font-weight:600}
.cat .foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.cat.active{background:var(--accent-soft)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--accent-soft);color:var(--accent)}
.monthnav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--r);padding:6px;box-shadow:var(--shadow)}
.monthnav b{font-weight:600}
.monthnav button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.monthnav button:disabled{opacity:.3}

/* Goals */
.goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal h3{margin:0;font-size:17px}
.goal .figs{font-family:var(--display);font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.goal .figs span{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);letter-spacing:0}
.goal .actions{display:flex;gap:8px;margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.4;cursor:default}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .inner{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:62px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);height:100%;justify-content:center}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}
.addkey{justify-self:center;width:54px;height:54px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);transform:translateY(-10px)}
.addkey svg{width:26px;height:26px}

/* Sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,10,.45);opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:92vh;max-height:92dvh;overflow:auto;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-h h2{font-family:var(--display);font-size:22px;margin:0;font-weight:700}
@media (prefers-reduced-motion: reduce){.sheet,.scrim,.bar i{transition:none}}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;width:100%;min-width:0}
.field .hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check b{display:block;font-size:15px}.check span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Keypad */
.amount{font-family:var(--display);font-weight:700;font-size:52px;text-align:center;letter-spacing:-.03em;padding:6px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.amount .cur{color:var(--muted);font-size:34px;vertical-align:.35em;margin-right:2px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border-radius:12px;background:var(--surface);font-size:22px;font-weight:600;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.keypad button:active{background:var(--surface-2)}
.pinwrap{display:flex;flex-direction:column;align-items:center;gap:18px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink-2)}
.dots i.f{background:var(--ink)}
.lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lock .inner{width:100%;max-width:320px}
.lock h2{font-family:var(--display);text-align:center;margin:0}

table.breakdown{width:100%;border-collapse:collapse;font-size:14px}
table.breakdown td{padding:7px 0;border-bottom:1px solid var(--line)}
table.breakdown td:last-child{text-align:right;font-variant-numeric:tabular-nums}
table.breakdown tr.total td{font-weight:700;border-bottom:0}
textarea{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:10px;font:13px ui-monospace,Menlo,monospace;color:var(--ink)}

/* Ask (chat) */
.chat{padding-bottom:72px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:6px}
.msg.err{background:var(--bad-soft);color:var(--bad);box-shadow:none}
.msg p{margin:0}.msg p+p,.msg p+ul,.msg p+ol,.msg ul+p,.msg ol+p{margin-top:8px}
.msg .lead{font-weight:600;font-size:16px;line-height:1.4}
.msg ul,.msg ol{margin:8px 0 0;padding-left:18px}.msg li{margin:3px 0}.msg li::marker{color:var(--accent)}
.msg .fine{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.msg.bot .num{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--accent)}
.chat > .chips{align-self:flex-start;margin-top:-6px}
.typing{display:flex;gap:4px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border-radius:22px;padding:11px 16px;font:16px var(--body);line-height:1.35}
.sendbtn{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.sendbtn svg{width:20px;height:20px}.sendbtn:disabled{opacity:.4}
@media (prefers-reduced-motion: reduce){.typing i{animation:none;opacity:.6}}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:all .2s;z-index:70;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>


<div class="app" id="app"></div>

<nav class="tabbar" aria-label="Main">
  <div class="inner">
    <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button class="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</button>
    <button class="addkey" data-action="add" aria-label="Add transaction"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-tab="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.3 2.4c-.5.2-.8.6-.8 1.1v.5"/><path d="M12 16.5h.01"/></svg>Ask</button>
    <button class="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
  </div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div class="lock" id="lock" hidden></div>

<script>
(function(){
"use strict";
const KEY="harshal-money-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const money=(n,dec)=>{const d=dec??(Math.abs(n)<100&&n%1!==0?2:0);return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",minimumFractionDigits:d,maximumFractionDigits:d}).format(n||0)};
const money2=n=>money(n,2);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>iso(new Date());
const ymOf=s=>s.slice(0,7);
const parseISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const monthName=(ym,long)=>{const[y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-US",{month:long?"long":"short",year:long?"numeric":undefined})};
const shiftYM=(ym,k)=>{const[y,m]=ym.split("-").map(Number);const d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const ord=n=>n+((n%100>=11&&n%100<=13)?"th":({1:"st",2:"nd",3:"rd"}[n%10]||"th"));
const initials=s=>(s||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();

const PERIODS={weekly:52,biweekly:26,semimonthly:24,monthly:12};

/* ---------- State ---------- */
let S;
let ui={tab:"home",month:ymOf(today()),catFilter:null};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.tx))return migrate(d)}}catch(e){}
  return sample();
}
function migrate(d){
  d.categories=d.categories||[];d.categories.forEach(c=>{if(c.need===undefined)c.need=!!NEED_DEFAULT[c.id]});
  if(!d.categories.some(c=>c.id==="card"))d.categories.unshift({id:"card",name:"Credit card",budget:0,need:false});
  const ym=ymOf(today());(d.bills||[]).forEach(b=>{if(!b.since)b.since=ym});
  const st=d.settings=d.settings||{};
  if(st.payMonthly===undefined)st.payMonthly=st.perCheck?Math.round(st.perCheck*(PERIODS[st.payFreq]||26)/12):0;
  if(st.target===undefined)st.target=4000;
  if(!d.started)d.started=ym+"-01";
  d.tx=d.tx.filter(t=>t.type!=="rsu");return d}
const DEFAULT_CATS=[["card","Credit card",0,false],["groceries","Groceries",450,true],["eating","Eating out",350,false],["transport","Transport",200,true],["shopping","Shopping",250,false],["fun","Fun",200,false],["health","Health",100,true],["other","Other",150,false]];
const NEED_DEFAULT={groceries:true,transport:true,health:true};
function baseState(){return{v:1,sample:false,
  started:today(),settings:{payMonthly:0,target:4000,theme:"system",pin:null},
  categories:DEFAULT_CATS.map(([id,name,budget,need])=>({id,name,budget,need})),tx:[],bills:[],goals:[]}}
/* Generic example numbers for demo data and hints. Your real values live only in Settings on your phone. */
const DEMO={pay:6000,target:4000};
function sample(){
  const s=baseState();s.sample=true;
  Object.assign(s.settings,{payMonthly:DEMO.pay,target:DEMO.target});
  let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const now=new Date();const notes={groceries:["QFC","Trader Joe's","Whole Foods","Safeway"],eating:["Lunch near office","Pho","Coffee","Dinner with friends","Pizza"],transport:["ORCA card","Uber","Gas","Parking"],shopping:["Clothes","Target","Home stuff"],fun:["Movie","Concert","Climbing gym day pass"],health:["Pharmacy"],other:["Haircut","Gift"]};
  const ranges={groceries:[25,110,7],eating:[9,65,12],transport:[6,45,6],shopping:[20,120,3],fun:[15,80,3],health:[10,40,1],other:[15,60,2]};
  [-1,0].forEach(k=>{
    const y=now.getFullYear(),m=now.getMonth()+k;const first=new Date(y,m,1);const last=k===0?now.getDate():daysIn(first.getFullYear(),first.getMonth());
    for(const[cat,[lo,hi,count]]of Object.entries(ranges)){
      const n=Math.max(1,Math.round(count*(last/30)*(k===0?1.05:1)));
      for(let i=0;i<n;i++){const d=new Date(first.getFullYear(),first.getMonth(),1+Math.floor(rnd()*last));
        const list=notes[cat];s.tx.push({id:uid(),type:"expense",cat,amount:Math.round((lo+rnd()*(hi-lo))*100)/100,date:iso(d),note:list[Math.floor(rnd()*list.length)]})}
    }
  });
  s.tx.push({id:uid(),type:"income",amount:64.2,date:iso(new Date(now.getFullYear(),now.getMonth(),Math.min(3,now.getDate()))),note:"Return refund"});
  s.bills=[["Rent",2400,"monthly",1],["Phone",65,"monthly",12],["Internet",60,"monthly",15],["Seattle City Light",70,"monthly",20],["Gym",45,"monthly",5],["Spotify",12,"monthly",8],["Netflix",18,"monthly",22],["Renter's insurance",180,"yearly",9,3]]
    .map(([name,amount,freq,day,month])=>({id:uid(),name,amount,freq,day,month:month||1}));
  const cym=ymOf(iso(now));const pym=shiftYM(cym,-1);s.bills.forEach(b=>b.since=pym);
  s.tx.push({id:uid(),type:"expense",cat:"card",amount:212.4,date:iso(new Date(now.getFullYear(),now.getMonth(),Math.min(6,now.getDate()))),note:"Card purchases"});s.bills.forEach(b=>{if(b.name==="Rent"||b.name==="Seattle City Light"){b.varies=true;b.hist={[cym]:b.amount}}});
  s.started=pym+"-01";Object.assign(s.settings,{jobStart:shiftYM(pym,-8),histMode:"monthly",histSet:true});
  s.history={};for(let i=8;i>=1;i--)s.history[shiftYM(pym,-i)]=[3100,3600,2900,4200,3800,3400,4100,3700][8-i];
  return s;
}

/* ---------- Derived numbers ---------- */
const catById=id=>S.categories.find(c=>c.id===id);
function monthlyIncome(){return +S.settings.payMonthly||0}
const curYM=()=>ymOf(today());
const billAmt=(b,ym)=>(b.varies&&b.freq!=="yearly"&&b.hist&&b.hist[ym]!=null)?b.hist[ym]:b.amount;
const billMonthly=b=>b.freq==="yearly"?b.amount/12:billAmt(b,curYM());
function pendingBills(){const t=new Date(),ym=curYM();const dim=daysIn(t.getFullYear(),t.getMonth());
  return S.bills.filter(b=>b.varies&&b.freq!=="yearly"&&!(b.hist&&b.hist[ym]!=null)&&t.getDate()>=Math.min(b.day,dim))}
const billsTotal=()=>S.bills.reduce((a,b)=>a+billMonthly(b),0);
const txIn=ym=>S.tx.filter(t=>ymOf(t.date)===ym);
const spentIn=(ym,cat)=>txIn(ym).filter(t=>t.type==="expense"&&(!cat||t.cat===cat)).reduce((a,t)=>a+t.amount,0);
const extraIn=ym=>txIn(ym).filter(t=>t.type==="income").reduce((a,t)=>a+t.amount,0);
function nextDue(b){const t=new Date();t.setHours(0,0,0,0);
  const mk=(y,m)=>new Date(y,m,Math.min(b.day,daysIn(y,m)));
  if(b.freq==="yearly"){let d=mk(t.getFullYear(),b.month-1);if(d<t)d=mk(t.getFullYear()+1,b.month-1);return d}
  let d=mk(t.getFullYear(),t.getMonth());if(d<t)d=mk(t.getFullYear(),t.getMonth()+1);return d}
const isNeed=id=>!!(catById(id)&&catById(id).need);
function billsIn(ym){const cur=curYM(),t=new Date();const[y,m]=ym.split("-").map(Number);const dim=daysIn(y,m-1);
  return S.bills.filter(b=>(b.since||"0000-00")<=ym&&(b.freq==="monthly"||b.month===m)&&(ym<cur||(ym===cur&&t.getDate()>=Math.min(b.day,dim)))).map(b=>({b,amt:billAmt(b,ym)}))}
function upcomingBills(){const t=new Date(),ym=curYM(),m=t.getMonth()+1,dim=daysIn(t.getFullYear(),t.getMonth());
  return S.bills.filter(b=>(b.freq==="monthly"||b.month===m)&&t.getDate()<Math.min(b.day,dim)).map(b=>({b,amt:billAmt(b,ym)}))}
function summary(ym){
  const bills=billsIn(ym),billsSum=bills.reduce((a,x)=>a+x.amt,0);
  const ex=txIn(ym).filter(t=>t.type==="expense");const by={};ex.forEach(t=>{by[t.cat]=(by[t.cat]||0)+t.amount});
  const row=id=>({id,name:(catById(id)||{}).name||"Other",amt:by[id]});
  const needCats=Object.keys(by).filter(isNeed).map(row).sort((a,b)=>b.amt-a.amt);
  const otherCats=Object.keys(by).filter(id=>!isNeed(id)).map(row).sort((a,b)=>b.amt-a.amt);
  const needs=billsSum+needCats.reduce((a,x)=>a+x.amt,0),others=otherCats.reduce((a,x)=>a+x.amt,0);
  const[y,m]=ym.split("-").map(Number);const days=ym===curYM()?new Date().getDate():daysIn(y,m-1);
  return{bills,billsSum,needCats,otherCats,needs,others,total:needs+others,days,everyday:ex.reduce((a,t)=>a+t.amount,0),count:ex.length};
}
/* Savings plan (monthly): pay - bills - savings goal = left to spend */
let PC={};
function billsMonthTotal(ym){const m=+ym.slice(5);return S.bills.filter(b=>(b.since||"0000-00")<=ym&&(b.freq==="monthly"||b.month===m)).reduce((a,b)=>a+billAmt(b,ym),0)}
function plan(ym){if(PC[ym])return PC[ym];
  const[y,m]=ym.split("-").map(Number),dim=daysIn(y,m-1),cur=curYM(),isCur=ym===cur;
  const td=isCur?new Date().getDate():dim;
  const pay=monthlyIncome()+extraIn(ym),bills=billsMonthTotal(ym),target=+S.settings.target||0;
  const spendable=pay-bills-target;
  const spent=txIn(ym).filter(t=>t.type==="expense").reduce((a,t)=>a+t.amount,0);
  const projSpend=isCur&&td?spent/td*dim:spent;
  const projSave=pay-bills-projSpend;
  const st=projSave>=target?"good":projSave>=target-400?"warn":"bad";
  return PC[ym]={ym,dim,td,isCur,pay,bills,target,spendable,spent,projSave,status:st}}

/* Balance: savings before the app (one total or month by month) + every tracked month since */
const startYM=()=>ymOf(S.started||today());
const adjIn=ym=>(S.adjust||[]).filter(a=>a.ym===ym).reduce((x,a)=>x+a.amount,0);
function monthNet(ym){
  if(ym<startYM())return S.settings.histMode==="monthly"?(+(S.history||{})[ym]||0):0;
  const p=plan(ym),bills=ym===curYM()?billsIn(ym).reduce((a,x)=>a+x.amt,0):p.bills;
  return p.pay-bills-p.spent+adjIn(ym)}
function firstYM(){const st=startYM(),js=S.settings.jobStart;return S.settings.histMode==="monthly"&&js&&js<st?js:st}
function timeline(){if(PC.tl)return PC.tl;
  let bal=S.settings.histMode==="monthly"?0:(+S.settings.openingTotal||0);const out=[{ym:shiftYM(firstYM(),-1),bal}];
  for(let ym=firstYM();ym<=curYM();ym=shiftYM(ym,1)){bal+=monthNet(ym);out.push({ym,bal})}
  return PC.tl=out}
const balanceNow=()=>timeline().at(-1).bal;
function pastMonths(){const out=[];let ym=shiftYM(curYM(),-1);const f=S.settings.histMode==="monthly"?firstYM():startYM();
  while(ym>=f&&out.length<12){const v=monthNet(ym);if(ym>=startYM()||(S.history||{})[ym]!=null)out.push({ym,saved:v,hit:v>=(+S.settings.target||0)});ym=shiftYM(ym,-1)}
  return out.reverse()}
function goalStreak(){const pm=pastMonths();let n=0;for(let i=pm.length-1;i>=0&&pm[i].hit;i--)n++;return n}

const daysUntil=d=>{const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)};
const dueText=d=>{const n=daysUntil(d);return n===0?"Today":n===1?"Tomorrow":n<7?d.toLocaleDateString("en-US",{weekday:"long"}):d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};

/* ---------- Icons ---------- */
const ICON={gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  fwd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>'};

/* ---------- Render ---------- */
function render(){PC={};
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===ui.tab));
  const v=({home:viewHome,history:viewHistory,ask:viewAsk,bills:viewBills,savings:viewSavings,settings:viewSettings}[ui.tab]||viewHome)();
  $("#app").innerHTML=v;
  const map={bills:"settings",savings:"settings"};document.querySelectorAll(".tab").forEach(b=>{if(map[ui.tab]===b.dataset.tab)b.classList.add("on")});
}
function topbar(title,right){return `<header class="topbar"><h1>${title}</h1>${right||""}</header>`}
function txRow(t){
  const isIn=t.type!=="expense";const c=catById(t.cat);
  const name=t.type==="income"?"Extra income":(c?c.name:"Uncategorized");
  return `<button class="row" data-action="edit-tx" data-id="${t.id}">
    <span class="badge ${isIn?"in":""}">${isIn?"+":esc(initials(name))}</span>
    <span class="grow"><div class="t">${esc(t.note||name)}</div><div class="s">${esc(name)} · ${parseISO(t.date).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</div></span>
    <span class="amt ${isIn?"in":""}">${isIn?"+":""}${money2(t.amount)}</span></button>`}

function splitHTML(sm,filterable){
  const tot=sm.total||1,np=sm.needs/tot*100,op=sm.others/tot*100;
  let h=`<div class="split" role="img" aria-label="Rent and needs ${Math.round(np)}%, other ${Math.round(op)}%">${sm.needs?`<i style="width:${np}%;background:var(--needs)"></i>`:""}${sm.others?`<i style="width:${op}%;background:var(--other)"></i>`:""}</div>
  <div class="legend"><div><span class="k"><i style="background:var(--needs)"></i>Rent & needs</span><b class="num">${money(sm.needs)}</b><span class="p">${sm.total?Math.round(np):0}% of spending</span></div>
  <div><span class="k"><i style="background:var(--other)"></i>Everything else</span><b class="num">${money(sm.others)}</b><span class="p">${sm.total?Math.round(op):0}% of spending</span></div></div>`;
  const line=(name,amt,id)=>filterable&&id?`<button class="line ${ui.catFilter===id?"active":""}" data-action="cat-filter" data-id="${id}"><span>${esc(name)}</span><span class="num">${money(amt)}</span></button>`:`<div class="line"><span>${esc(name)}</span><span class="num">${money(amt)}</span></div>`;
  const needRows=sm.bills.map(x=>`<button class="line" data-action="edit-bill" data-id="${x.b.id}"><span>${esc(x.b.name)}</span><span class="num">${money(x.amt)}</span></button>`).concat(sm.needCats.map(c=>line(c.name,c.amt,c.id)));
  if(needRows.length)h+=`<div class="group"><h3><i style="background:var(--needs)"></i>Rent & needs</h3>${needRows.join("")}</div>`;

const FIN_RE=/\$|\b(money|spen[dt]|spending|sav(e|ed|es|ing|ings)|goals?|budget\w*|bills?|rent|pa(y|id)|paycheck|income|salary|earn\w*|afford\w*|cost\w*|expens\w*|buy|bought|purchas\w*|transactions?|charge[ds]?|card|cash|dollars?|owe|debt|invest\w*|interest|financ\w*|balance|account|cheap\w*|price\w*|subscriptions?|net worth|emergency fund|broke|splurge\w*|refunds?|on track|compare\w*|this month|last month|how am i doing)\b/i;

const MON_RE=/\b(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|(?:in|for|during|of|since) may|may \d{4}|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)\b/g;
const MON_IDX=["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];

const isFinanceQ=q=>FIN_RE.test(q)||aiCats(q).length>0||aiBillHits(q).length>0||aiNoteHits(q).length>0;
function aiMonths(q){const cur=curYM(),f=firstYM(),out=new Set(),back=n=>{for(let i=0;i<n;i++)out.add(shiftYM(cur,-i))};

function aiRetrieve(q){PC={};q=q.toLowerCase();

    else{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"content-type":"application/json","x-api-key":aiKey(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:AI_MODEL,max_tokens:400,system:AI_RULES,messages})});
    const out=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(res.status===401?"That API key didn't work. Check it in Settings.":res.status===429?"Too many requests. Try again in a minute.":(out.error&&out.error.message)||"Something went wrong. Try again.");
    raw=(out.content||[]).map(c=>c.text||"").join("");}
    raw=aiClean(raw);
    if(/^INVALID\b/i.test(raw)){u.invalid=true;chat.msgs.push({role:"assistant",text:INVALID,invalid:true})}
    else if(/^ASK:/i.test(raw)&&chat.asks<MAX_ASKS){const[q,...opts]=raw.slice(4).split("||").map(s=>s.trim()).filter(Boolean);
      chat.msgs.push({role:"assistant",kind:"ask",text:q||raw,options:opts.slice(0,4)});chat.asks++}
    else{chat.msgs.push({role:"assistant",kind:"answer",text:raw.replace(/^ASK:\s*/i,"").split("||")[0].trim()||"I couldn't work that out from your data."});chat.asks=0}
  }catch(e){u.error=true;chat.msgs.push({role:"assistant",error:true,text:e instanceof TypeError?"Couldn't reach the assistant. Check your connection.":e.message})}
  chat.busy=false;render();scrollChat();
}
const scrollChat=()=>{if(ui.tab==="ask")requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight))};
const fmtMsg=s=>esc(s).replace(/\n/g,"<br>");
const mdInline=s=>s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^\w])(-?\$\d[\d,]*(?:\.\d+)?)/g,'$1<span class="num">$2</span>');
function mdLite(text,lead){
  const out=[];let cur=null,first=true;
  esc(text).split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const b=l.match(/^[-–]\s+(.*)/),n=l.match(/^\d+[.)]\s+(.*)/);
    if(b||n){const t=b?"ul":"ol";if(!cur||cur.t!==t){cur={t,items:[]};out.push(cur)}cur.items.push(mdInline((b||n)[1]));return}
    cur=null;
    if(/^(assum\w*|note)\s*:/i.test(l))out.push({fine:mdInline(l)});
    else{out.push({p:mdInline(l),lead:lead&&first});}
    first=false});
  return out.map(x=>x.t?`<${x.t}>${x.items.map(i=>`<li>${i}</li>`).join("")}</${x.t}>`:x.fine?`<div class="fine">${x.fine}</div>`:`<p${x.lead?' class="lead"':""}>${x.p}</p>`).join("")}

function catsSheet(){
  const rowsHTML=()=>S.categories.map(c=>`<div data-cid="${c.id}" style="display:grid;grid-template-columns:1fr auto 40px;gap:10px;align-items:center">
    <input aria-label="Category name" data-f="name" value="${esc(c.name)}" style="height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:16px;min-width:0">
    <label style="display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink-2)"><input type="checkbox" data-f="need" ${c.need?"checked":""} style="width:20px;height:20px;accent-color:var(--needs)">Need</label>
    <button class="iconbtn" type="button" data-del="${c.id}" aria-label="Remove ${esc(c.name)}">${ICON.close}</button></div>`).join("");
  openSheet("Categories",`<div class="stack"><p class="small ink2" style="margin:0">Tick <b>Need</b> for spending you can't avoid, like groceries. It's counted with rent in "Rent & needs". Everything else goes in "Everything else".</p><div class="stack" id="crows">${rowsHTML()}</div>
    <button class="btn block" type="button" id="cadd">${ICON.plus.replace('<svg','<svg width="16" height="16"')} Add category</button><button class="btn primary block" id="cdone">Done</button></div>`,sh=>{
    const sync=()=>{sh.querySelectorAll("[data-cid]").forEach(r=>{const c=catById(r.dataset.cid);if(!c)return;c.name=r.querySelector('[data-f="name"]').value.trim()||c.name;c.need=r.querySelector('[data-f="need"]').checked})};
    sh.querySelector("#crows").oninput=sync;sh.querySelector("#crows").onchange=sync;
    sh.querySelector("#crows").onclick=e=>{const b=e.target.closest("[data-del]");if(!b)return;sync();
      const id=b.dataset.del;const used=S.tx.some(t=>t.cat===id);
      if(used&&id==="other"){toast("Other is used by past purchases");return}
      if(used){if(!catById("other"))S.categories.push({id:"other",name:"Other",budget:0,need:false});S.tx.forEach(t=>{if(t.cat===id)t.cat="other"});toast("Its purchases moved to Other")}
      S.categories=S.categories.filter(c=>c.id!==id);sh.querySelector("#crows").innerHTML=rowsHTML()};
    sh.querySelector("#cadd").onclick=()=>{sync();S.categories.push({id:uid(),name:"New category",budget:0,need:false});sh.querySelector("#crows").innerHTML=rowsHTML();const ins=sh.querySelectorAll('[data-f="name"]');ins[ins.length-1].select()};
    sh.querySelector("#cdone").onclick=()=>{sync();closeSheet();commit("Categories saved")};
    return ()=>{sync();save();render()};
  });
}

/* ---------- PIN ---------- */
async function hashPin(p){const s="hm-salt:"+p;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of s)h=(h*33^c.charCodeAt(0))>>>0;return "f"+h.toString(16)}}
function pinPad(container,title,onDone){let v="";
  const draw=()=>{container.querySelector(".dots").innerHTML=[0,1,2,3].map(i=>`<i class="${i<v.length?"f":""}"></i>`).join("")};
  container.innerHTML=`<div class="pinwrap"><h2 style="font-family:var(--display);margin:0;font-size:22px" id="ptitle">${title}</h2><div class="dots"></div><div style="width:100%">${keypadHTML(" ")}</div></div>`;
  container.querySelector(".keypad").onclick=async e=>{const b=e.target.closest("[data-key]");if(!b)return;const k=b.dataset.key;
    if(k==="⌫")v=v.slice(0,-1);else if(/\d/.test(k)&&v.length<4)v+=k;draw();
    if(v.length===4){const val=v;setTimeout(async()=>{const r=await onDone(val);if(r===false){v="";draw()}},120)}};
  draw();return t=>{container.querySelector("#ptitle").textContent=t};
}
function showLock(){const L=$("#lock");L.hidden=false;L.innerHTML=`<div class="inner"></div>`;
  const setT=pinPad(L.querySelector(".inner"),"Enter PIN",async p=>{if(await hashPin(p)===S.settings.pin){L.hidden=true;L.innerHTML="";setTimeout(maybePrompt,300);return true}setT("Wrong PIN. Try again.");return false})}
function pinSetup(){openSheet("Set PIN",`<div id="pp"></div>`,sh=>{let first=null;
  const setT=pinPad(sh.querySelector("#pp"),"Choose a 4-digit PIN",async p=>{if(!first){first=p;setT("Enter it again");return false}
    if(p!==first){first=null;setT("Didn't match. Choose a PIN");return false}S.settings.pin=await hashPin(p);closeSheet();commit("PIN lock on");return true})})}

/* ---------- Backup ---------- */
async function exportData(){
  const json=JSON.stringify(S,null,1);const name=`money-backup-${today()}.json`;
  try{const f=new File([json],name,{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});toast("Backup ready");return}}catch(e){if(e&&e.name==="AbortError")return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  openSheet("Backup",`<p class="small ink2" style="margin:0 0 10px">If no file was saved, copy this text and keep it in Notes or Files.</p><textarea id="bk" readonly>${esc(json)}</textarea><div style="height:10px"></div><button class="btn primary block" id="cp">Copy</button>`,sh=>{
    sh.querySelector("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(json);toast("Copied")}catch(e){const t=sh.querySelector("#bk");t.focus();t.select();toast("Text selected. Tap Copy.")}}});
}
function importData(){
  openSheet("Restore backup",`<div class="stack"><div class="field"><label for="bfile">Backup file</label><input type="file" id="bfile" accept=".json,application/json"></div>
    <div class="field"><label for="btext">Or paste backup text</label><textarea id="btext" placeholder='{"v":1, ...}'></textarea></div>
    <button class="btn primary block" id="bgo">Restore</button><div class="small muted">This replaces everything currently in the app.</div></div>`,sh=>{
    const apply=txt=>{try{const d=JSON.parse(txt);if(!d||!Array.isArray(d.tx)||!Array.isArray(d.categories))throw 0;S=Object.assign(baseState(),d);S.settings=Object.assign(baseState().settings,d.settings||{});applyTheme();closeSheet();commit("Backup restored")}catch(e){toast("That doesn't look like a backup file")}};
    sh.querySelector("#bgo").onclick=()=>{const f=sh.querySelector("#bfile").files[0];if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else apply(sh.querySelector("#btext").value)};
  });
}

/* ---------- Theme ---------- */
let themeSetByApp=false;
function applyTheme(){const t=S.settings.theme;const r=document.documentElement;
  if(t==="light"||t==="dark"){r.setAttribute("data-theme",t);themeSetByApp=true}
  else if(themeSetByApp){r.removeAttribute("data-theme");themeSetByApp=false}}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){closeSheet();return}
  const tabEl=e.target.closest("[data-tab]");if(tabEl&&!e.target.closest("#sheet")){ui.tab=tabEl.dataset.tab;if(ui.tab!=="history")ui.catFilter=null;render();window.scrollTo(0,0);return}
  const a=e.target.closest("[data-action]");if(!a)return;const id=a.dataset.id;
  switch(a.dataset.action){
    case "close":closeSheet();break;
    case "add":txSheet();break;
    case "edit-tx":txSheet(id);break;
    case "edit-bill":billSheet(id);break;
    case "ask-bill":askBill(id);break;
    case "edit-cats":catsSheet();break;
    case "fix-balance":fixBalanceSheet();break;
    case "ask-opt":aiSend(a.dataset.v);break;
    case "ask-new":chat={msgs:[],asks:0,busy:false,draft:""};render();break;
    case "pay":paySheet();break;
    case "hist-done":S.settings.histSet=true;ui.tab="home";commit("Savings history saved");window.scrollTo(0,0);break;
    case "month":ui.month=shiftYM(ui.month,+a.dataset.k);render();break;
    case "cat-filter":ui.catFilter=(id&&ui.catFilter!==id)?id:null;render();break;
    case "set":S.settings[a.dataset.k]=a.dataset.v;if(a.dataset.k==="histMode")S.settings.histSet=true;if(a.dataset.k==="theme")applyTheme();commit();break;
    case "export":exportData();break;
    case "import":importData();break;
    case "start-fresh":confirmSheet("Clear example data?","This removes the example transactions, bills and goals. Your categories stay, and you can change them anytime.","Clear examples",()=>{const keep=S.categories;S=baseState();S.categories=keep;S.settings.payMonthly=0;applyTheme();ui.tab="settings";commit("Examples cleared. Add your paycheck next.")});break;
    case "reset":confirmSheet("Erase everything?","All transactions, bills, goals and settings on this phone will be deleted. Export a backup first if you might want them.","Erase everything",()=>{S=baseState();applyTheme();ui.tab="home";commit("All data erased")});break;
  }
});
document.addEventListener("change",e=>{const hm=e.target.dataset&&e.target.dataset.hist;
  if(hm){S.history=S.history||{};const raw=String(e.target.value).replace(/[$,\s]/g,"");if(raw==="")delete S.history[hm];else S.history[hm]=parseFloat(raw)||0;S.settings.histSet=true;save();render();return}
  if(e.target.id==="aiUrl"||e.target.id==="aiLModel"){const k=e.target.id==="aiUrl"?AI_URL:AI_LMODEL;let v=e.target.value.trim();
    if(k===AI_URL&&v&&!/^https:\/\//i.test(v)){toast("Use the https:// address from Tailscale");return}
    try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(err){}toast(k===AI_URL?(v?"Laptop address saved":"Laptop address removed"):"Saved");render();return}
  if(e.target.id==="aiKey"){const v=e.target.value.trim();try{v?localStorage.setItem(AI_KEY,v):localStorage.removeItem(AI_KEY)}catch(err){}toast(v?"API key saved":"API key removed");return}
  const k=e.target.dataset&&e.target.dataset.setting;if(!k)return;let v=e.target.value;
  if(k!=="payFreq"&&k!=="jobStart")v=parseFloat(String(v).replace(/[$,%\s]/g,""))||0;S.settings[k]=v;if(k==="openingTotal")S.settings.histSet=true;
  save();render();toast("Saved")});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();
  if(e.target.id==="askin"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();aiSend(e.target.value)}});
document.addEventListener("input",e=>{if(e.target.id==="askin"){chat.draft=e.target.value;e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"}});
document.addEventListener("submit",e=>{if(e.target.id==="askf"){e.preventDefault();aiSend($("#askin").value)}});

S=load();applyTheme();render();setTimeout(maybePrompt,500);
if(S.settings.pin)showLock();
})();
</script>
